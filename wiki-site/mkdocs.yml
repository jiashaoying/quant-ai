# 本文件由 wiki-site/build.py 生成，请勿手工编辑 nav 部分
site_name: quant-ai 量化策略查看系统文档
site_description: 股票量化策略查看与回测系统（Repo Wiki）静态文档站
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  features:
    - navigation.indexes
    - navigation.top
    - navigation.sections
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
plugins:
  - search
validation:
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore
nav:
